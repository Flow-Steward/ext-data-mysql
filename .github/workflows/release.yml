name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.repository }}-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'Flow-Steward'
    uses: Flow-Steward/extensions/.github/workflows/build-extension.yml@937f5e6ae8d4118c18d65d88826b0521582c7f76
    with:
      build_native: true
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed release source independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}
          path: reviewed
          persist-credentials: false
      - name: Check out the pinned publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Flow-Steward/extensions
          ref: 4ad7b1131c72c381d6bcbb5613f209b077a01ce0
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Download only the artifact for this workflow attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts
      - name: Verify the archive entries against the reviewed Git tree and native manifest
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          source_sha="$(git -C reviewed rev-parse HEAD)"
          python -I tooling/scripts/release_extension.py verify-plan \
            --artifact-dir release-artifacts --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-sha "$source_sha" --catalog-root tooling
          for target in linux-amd64 linux-arm64; do
            package="release-artifacts/flowsteward.data-connector-mcp-toolbox-mysql-${RELEASE_TAG#v}-$target.zip"
            python -I reviewed/scripts/package_extension.py \
              --runtime-target "$target" --verify-archive "$package"
          done
      - name: Publish once, or verify an identical existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          source_sha="$(git -C reviewed rev-parse HEAD)"
          python tooling/scripts/publish_extension_release.py \
            --artifact-dir release-artifacts --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-sha "$source_sha"
