manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.data-connector-mcp-toolbox-mysql
kind: tool_provider
version: "1.3.9"
release_stage: active
display_name: MySQL & MariaDB
description: 'Connect MySQL and MariaDB data to Flow Steward through direct MySQL, MariaDB or Cloud SQL
  for MySQL profiles. Read-only Datasets support testing the connection, inspecting table schemas, validating
  saved SQL against selected tables and columns, previewing results, executing saved queries and inferring
  output schemas. Use application lookups, reporting extracts and reusable queries to supply data to later
  workflow steps.


  A separate workflow action executes one INSERT, UPDATE or DELETE with named parameters and an optional
  parameter schema. Use it to save workflow results or change application records while keeping Dataset
  queries read-only. Parameter values are supplied separately from the SQL statement, allowing the same
  query or write to be reused with different workflow inputs.


  Direct MySQL and MariaDB connections need a host, database, user and password. The Cloud SQL profile
  uses project, region, instance and database settings with the appropriate Google Cloud access and authentication
  configuration. Read output is limited to 100 rows and 480 KiB. SQL support is a restricted subset; schema-changing
  statements, transaction scripts and database triggers are outside the connector''s operation set.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-data-mysql/issues
  website_url: https://github.com/Flow-Steward/ext-data-mysql
listing:
  category: data
  tags:
  - mysql
  - database
  - sql
  - dataset
  summary: Query MySQL, MariaDB or Cloud SQL for MySQL Datasets and run parameterized INSERT, UPDATE or
    DELETE actions.
  description: 'Connect MySQL and MariaDB data to Flow Steward through direct MySQL, MariaDB or Cloud
    SQL for MySQL profiles. Read-only Datasets support testing the connection, inspecting table schemas,
    validating saved SQL against selected tables and columns, previewing results, executing saved queries
    and inferring output schemas. Use application lookups, reporting extracts and reusable queries to
    supply data to later workflow steps.


    A separate workflow action executes one INSERT, UPDATE or DELETE with named parameters and an optional
    parameter schema. Use it to save workflow results or change application records while keeping Dataset
    queries read-only. Parameter values are supplied separately from the SQL statement, allowing the same
    query or write to be reused with different workflow inputs.


    Direct MySQL and MariaDB connections need a host, database, user and password. The Cloud SQL profile
    uses project, region, instance and database settings with the appropriate Google Cloud access and
    authentication configuration. Read output is limited to 100 rows and 480 KiB. SQL support is a restricted
    subset; schema-changing statements, transaction scripts and database triggers are outside the connector''s
    operation set.'
  setup_summary: Choose MySQL, MariaDB or Cloud SQL for MySQL and configure its direct endpoint or cloud
    instance settings. Store direct-database passwords in secrets; Cloud SQL requires the runtime’s appropriate
    Google Cloud credentials and instance/database access.
package:
  format: flow-steward-extension
  license: Apache-2.0
  includes_source: true
billing_mode: free
upgrade_notes: Preserves the installed extension and connection identifiers. Settings and packaging now
  belong exclusively to MySQL & MariaDB.
screenshots:
- label: Overview
  description: MySQL & MariaDB connection profiles and supported operations.
  path: ui/components/overview.yaml
features:
- tool
- dataset_connector
- action
- query
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_data_connector_mcp_toolbox_mysql
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: project
  description: MySQL & MariaDB connections are project-scoped and resolved through project config and
    secrets.
external_effects:
- operation_id: execute_write
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types:
    - connection_type_id: toolbox_sql_writer
      display_name: MySQL & MariaDB
      description: Project connection for parameterized MySQL & MariaDB workflow writes.
      config_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: &id001
            - mysql
            - mariadb
            - cloud-sql-mysql
            description: Select a MySQL & MariaDB connection profile.
          host:
            type: string
            title: Host
            minLength: 1
          port:
            type: integer
            title: Port
            minimum: 1
            maximum: 65535
          database:
            type: string
            title: Database
            minLength: 1
          user:
            type: string
            title: User
            minLength: 1
          query_params:
            type: string
            title: Connection query parameters
          project:
            type: string
            title: Cloud project
            minLength: 1
          region:
            type: string
            title: Cloud region
            minLength: 1
          instance:
            type: string
            title: Instance
            minLength: 1
          ip_type:
            type: string
            title: IP type
        allOf:
        - if:
            properties:
              prebuilt:
                const: mysql
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: mariadb
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: cloud-sql-mysql
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
        title: MySQL & MariaDB connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for mysql, mariadb. Supply password or the matching profile-specific
              secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional;
              public config env is not a credential source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              CLOUD_SQL_MYSQL_PASSWORD:
                type: string
                minLength: 1
              MYSQL_PASSWORD:
                type: string
                minLength: 1
        title: MySQL & MariaDB password
        description: Password is required for mysql, mariadb. Supply password or the matching profile-specific
          secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional; public
          config env is not a credential source.
      capabilities:
        write_queries: true
      safety_profile:
        stores_secret_values: false
    dataset_connectors:
    - connector_id: toolbox_database
      connector_type_id: toolbox_database
      database_kind: database
      display_name: MySQL & MariaDB
      description: Read-only schema inspection and saved queries for MySQL & MariaDB.
      source_kind: database
      source_extension_id: flowsteward.data-connector-mcp-toolbox-mysql
      source_extension_name: MySQL & MariaDB
      source_provider: MySQL & MariaDB
      query_language: sql
      access_mode: read_only
      runtime_kind: local_extension
      runtime_adapter_ref: extensions/flowsteward_data_connector_mcp_toolbox_mysql/main.py
      connector_catalog:
      - source_kind: cloud-sql-mysql
        connector_type_id: toolbox_cloud_sql_mysql
        display_name: Cloud SQL for MySQL
        query_language: sql
        preset_config:
          prebuilt: cloud-sql-mysql
      - source_kind: mariadb
        connector_type_id: toolbox_mariadb
        display_name: MariaDB
        query_language: sql
        preset_config:
          prebuilt: mariadb
      - source_kind: mysql
        connector_type_id: toolbox_mysql
        display_name: MySQL
        query_language: sql
        preset_config:
          prebuilt: mysql
      connection_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: *id001
            description: Select a MySQL & MariaDB connection profile.
          database:
            type: string
            title: Database or dataset
            description: Database, dataset, namespace, or local file value used by this Toolbox source
              when applicable.
          host:
            type: string
            title: Host
            description: Host for networked Toolbox sources when applicable.
          port:
            type: integer
            minimum: 1
            maximum: 65535
            title: Port
            description: Port for networked Toolbox sources when applicable.
          user:
            type: string
            title: User
            description: User name for sources that authenticate with a database user.
          query_params:
            type: string
            title: Query params
            description: Optional connection query params passed to Toolbox when supported by the source.
          project:
            type: string
            title: Cloud project
          region:
            type: string
            title: Cloud region
          instance:
            type: string
            title: Instance
          ip_type:
            type: string
            title: IP type
          env:
            type: object
            title: Profile environment overrides
            additionalProperties: false
            properties:
              CLOUD_SQL_MYSQL_PROJECT:
                type: string
              CLOUD_SQL_MYSQL_REGION:
                type: string
              CLOUD_SQL_MYSQL_INSTANCE:
                type: string
              CLOUD_SQL_MYSQL_DATABASE:
                type: string
              CLOUD_SQL_MYSQL_USER:
                type: string
              CLOUD_SQL_MYSQL_IP_TYPE:
                type: string
              MYSQL_HOST:
                type: string
              MYSQL_PORT:
                type: string
              MYSQL_DATABASE:
                type: string
              MYSQL_USER:
                type: string
              MYSQL_QUERY_PARAMS:
                type: string
        allOf:
        - if:
            properties:
              prebuilt:
                const: mysql
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: mariadb
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: cloud-sql-mysql
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
        title: MySQL & MariaDB connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for mysql, mariadb. Supply password or the matching profile-specific
              secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional;
              public config env is not a credential source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              CLOUD_SQL_MYSQL_PASSWORD:
                type: string
                minLength: 1
              MYSQL_PASSWORD:
                type: string
                minLength: 1
        description: Password is required for mysql, mariadb. Supply password or the matching profile-specific
          secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles keep password optional; public
          config env is not a credential source.
      capabilities:
        read_only: true
        test_connection: true
        schema_introspection: true
        validate_query: true
        preview_query: true
        execute_template: true
        infer_output_schema: true
        write_queries: false
        row_preview: true
      safety_profile:
        access_mode: read_only
        indexes_rows: false
        executes_write_queries: false
        requires_saved_template: true
      preview_support: true
      schema_refresh_support: true
    operation_manifest:
    - operation_id: execute_write
      display_name: 'SQL: Insert, update or delete rows'
      workflow_visible: true
      operation_kind: action
      category: database
      description: 'Write workflow results to MySQL & MariaDB using one parameterized INSERT, UPDATE or
        DELETE. Select a MySQL & MariaDB project connection with write permission. Example: save a processing
        result with INSERT INTO workflow_results (record_id, status) VALUES (:record_id, :status), then
        provide Parameters and a type for each named parameter. Use Dataset saved queries for read-only
        SELECTs. Test mode validates this action without writing; SQL syntax must be supported by the
        selected database.'
      connection_type_ids:
      - toolbox_sql_writer
      required_scopes:
      - extension:invoke
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
        display_name: MySQL & MariaDB project connection
        description: Select an existing project connection for MySQL & MariaDB, configured with the correct
          profile and credentials in connection secrets. Its database user needs permission to execute
          your statement.
      - name: sql
        value_type: text
        required: true
        display_name: SQL write statement
        description: Enter one INSERT, UPDATE or DELETE supported by the selected database. Bind values
          with :named placeholders, provide Parameters and declare every placeholder type. Use a Dataset
          saved query for SELECT reads.
      - name: params
        value_type: object
        required: false
        display_name: Parameters (JSON)
        description: 'Object containing a value for every :named SQL placeholder. Bind workflow values
          here rather than inserting them into SQL text. Example: {"record_id":1042,"status":"approved"}.'
      - name: param_schema
        value_type: object
        required: false
        display_name: Parameter types (JSON Schema)
        description: 'Declare a type for every :named SQL placeholder in properties, matching the Parameters
          object. Required when SQL uses parameters; omit only for SQL without placeholders. Supported
          types: string, integer, number, boolean and null.'
      outputs:
      - name: status
        value_type: text
      - name: rows
        value_type: array
      - name: returned_row_count
        value_type: integer
      result_fields:
      - result.status
      - result.rows
      - result.returned_row_count
      error_codes:
      - invalid_payload
      - write_outcome_unknown
    - operation_id: test_connection
      workflow_visible: false
      operation_kind: action
      description: Validate that the MySQL & MariaDB driver can list tables for the configured MySQL &
        MariaDB connection.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.connector_id
      - result.metadata.toolbox_prebuilt
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: introspect_schema
      workflow_visible: false
      operation_kind: action
      description: Return a normalized typed schema snapshot from the MySQL & MariaDB driver list_tables
        output.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.schema_snapshot.schema_version
      - result.schema_snapshot.resources[].resource_id
      - result.schema_snapshot.resources[].columns[].name
      - result.schema_snapshot.resources[].indexes[].columns[]
      - result.resource_count
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: validate_query
      workflow_visible: false
      operation_kind: action
      description: Validate a saved read-only query template against dataset resource scope.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.valid
      - result.read_only
      - result.referenced_resources[]
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: preview_query
      workflow_visible: false
      operation_kind: action
      description: Execute a bounded read-only preview for a validated query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: execute_template
      workflow_visible: false
      operation_kind: action
      description: Execute a saved read-only query template with named parameters and runtime row limits.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      - result.truncated
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: infer_output_schema
      workflow_visible: false
      operation_kind: action
      description: Infer output schema from a bounded read-only preview of the query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    resource_query_manifest:
    - query_id: runtime_health
      cursor_mode: none
      description: Return extension runtime health.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.extension_id
      error_codes:
      - unknown_query
      - connector_runtime_failed
    - query_id: supported_connectors
      cursor_mode: none
      description: Return the supported connector catalog for this extension.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.connectors[].connector_type_id
      - result.connectors[].display_name
      - result.connectors[].database_kind
      - result.connectors[].source_provider
      - result.connectors[].access_mode
      error_codes:
      - unknown_query
      - connector_runtime_failed
    step_ui_manifest: contracts/step_ui_manifest.yaml
