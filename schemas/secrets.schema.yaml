$schema: https://json-schema.org/draft/2020-12/schema
title: MySQL & MariaDB secrets
type: object
additionalProperties: false
properties:
  password:
    type: string
    title: Password
    minLength: 1
    description: Password is required for mysql, mariadb. Supply password or the matching
      profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles
      keep password optional; public config env is not a credential source.
  env:
    type: object
    title: Profile-specific secret environment
    additionalProperties: false
    properties:
      CLOUD_SQL_MYSQL_PASSWORD:
        type: string
        minLength: 1
      MYSQL_PASSWORD:
        type: string
        minLength: 1
description: Password is required for mysql, mariadb. Supply password or the matching
  profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB IAM profiles
  keep password optional; public config env is not a credential source.
